name: HolonNPU CI

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holonnpu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC: gcc-15
  CXX: g++-15

jobs:
  build-test:
    name: Build and test research baseline
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-15 g++-15 gcc-15-riscv64-linux-gnu g++-15-riscv64-linux-gnu \
            ninja-build python3 cmake

      - name: Configure debug
        run: cmake --preset debug
      - name: Build debug
        run: cmake --build --preset debug --parallel 2
      - name: Test debug
        run: ctest --preset debug

      - name: Configure regression
        run: cmake --preset regression -DHOLON_NPU_RISCV_GCC=riscv64-linux-gnu-gcc-15
      - name: Build regression
        run: cmake --build --preset regression --parallel 2
      - name: Test regression and RV32 toolchain
        run: ctest --preset regression

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          if-no-files-found: error
          path: |
            build/debug/Testing/
            build/regression/Testing/
            build/regression/scalar-toolchain/
